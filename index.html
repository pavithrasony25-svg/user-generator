<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random user generation</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-..." crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-..."
        crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <h1 class="text-center mt-4 mb-4"> Random user generator</h1>
        <div class=" text-center mt-5 mb-4">
            <button class="btn btn-primary" onclick="displayuserseach()">Generate Random user details</button>
        </div>
         <div class="row justify-content-center" id="generate">
        </div>
    </div>
    <script>
        async function fetchUser() {
            try {
                const response = await fetch('https://randomuser.me/api/');
                  console.log(response);
                    const data = await response.json();
                 console.log(data);
                return data.results;

            }
            catch(err){
                     console.log(err);
                throw err;

            }
        }
        async function displayuserseach() {
            const user=await fetchUser();
            console.log(user);
            const generatecard=document.getElementById('generate');
            const cardsgener=user.map(item=>
                `
                <div class="col">
                    <div class="">
                        <div class="card-body text-center">
                            <img src="${item.picture.large}" width='120' height='120'>
                            <h5>${item.name.first} ${item.name.last}
                                </h5>
                                <p>${item.email}</p>
                                <p>${item.location.city}</p>
                                <p>${item.phone}</p>
                                </div>
                                </div>
                                </div>


    `
            ).join('');

            generatecard.innerHTML=cardsgener;
        }


    </script>
</body>
</html>
